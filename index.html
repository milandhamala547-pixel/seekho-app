<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Seekho — Learn AI, Code & Money</title>
<meta name="theme-color" content="#12213F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Seekho">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12213F; --ink-2:#1B2E52; --ink-3:#233A63;
    --gold:#FFB627; --teal:#2EC4B6; --rose:#F2637B; --violet:#B39CFF;
    --text:#F1EFE6; --muted:#9FAAC7; --line:rgba(241,239,230,0.10); --radius:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{background:var(--ink); color:var(--text); font-family:'Inter',sans-serif; display:flex; justify-content:center; min-height:100vh;}
  #shell{width:100%; max-width:480px; min-height:100vh; display:flex; flex-direction:column; position:relative;
    background:radial-gradient(600px 300px at 100% -10%, rgba(255,182,39,0.10), transparent 60%),
      radial-gradient(500px 260px at -10% 0%, rgba(46,196,182,0.08), transparent 55%), var(--ink);}
  h1,h2,h3{font-family:'Fraunces',serif; margin:0; letter-spacing:-0.01em;}
  code,.mono{font-family:'IBM Plex Mono',monospace;}
  ::selection{background:var(--gold); color:var(--ink);}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  header.topbar{padding:22px 20px 14px; display:flex; align-items:center; justify-content:space-between;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{width:34px;height:34px;border-radius:9px; background:linear-gradient(155deg,var(--gold),#d98f12);
    display:flex;align-items:center;justify-content:center; font-family:'Fraunces',serif; font-weight:700; color:var(--ink); font-size:17px;}
  .brand-name{font-family:'Fraunces',serif; font-size:19px; font-weight:600;}
  .brand-sub{font-size:11px; color:var(--muted); margin-top:-2px;}

  main{flex:1; padding:4px 20px 100px; overflow-y:auto;}

  .hero{padding:20px; margin-top:6px; margin-bottom:18px; border-radius:var(--radius);
    background:linear-gradient(160deg, var(--ink-2), var(--ink-3)); border:1px solid var(--line); position:relative; overflow:hidden;}
  .hero-eyebrow{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--gold); font-weight:700;}
  .hero h1{font-size:25px; line-height:1.15; margin-top:8px; font-weight:600;}
  .hero p{color:var(--muted); font-size:13.5px; margin-top:10px; line-height:1.5;}
  .hero-stats{display:flex; gap:10px; margin-top:16px;}
  .hero-stat{flex:1; background:rgba(255,255,255,0.05); border:1px solid var(--line); border-radius:12px; padding:10px; text-align:center;}
  .hero-stat .n{font-family:'Fraunces',serif; font-size:19px; color:var(--gold); font-weight:600;}
  .hero-stat .l{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px;}

  .section-label{font-size:12px; text-transform:uppercase; letter-spacing:0.12em; color:var(--muted); font-weight:700; margin:22px 2px 12px;}

  .track-card{display:flex; align-items:center; gap:14px; padding:16px; border-radius:16px;
    background:var(--ink-2); border:1px solid var(--line); margin-bottom:12px; cursor:pointer; transition:transform .15s ease;}
  .track-card:active{transform:scale(0.98);}
  .track-icon{width:46px;height:46px;border-radius:13px;flex:none; display:flex;align-items:center;justify-content:center; font-size:20px;}
  .track-body{flex:1; min-width:0;}
  .track-title{font-family:'Fraunces',serif; font-size:16.5px; font-weight:600;}
  .track-desc{font-size:12px; color:var(--muted); margin-top:2px;}
  .track-hours{font-size:10.5px; color:var(--muted); margin-top:6px; font-weight:600;}
  .track-progress-wrap{margin-top:8px; height:5px; border-radius:4px; background:rgba(255,255,255,0.08); overflow:hidden;}
  .track-progress-bar{height:100%; border-radius:4px;}
  .chev{color:var(--muted); font-size:18px; flex:none;}

  .backrow{display:flex; align-items:center; gap:10px; margin:16px 0 6px; cursor:pointer;}
  .backrow .arrow{font-size:18px; color:var(--gold);}
  .backrow .label{font-size:13px; color:var(--muted); font-weight:600;}
  .track-header{padding:6px 2px 8px;}
  .track-header h2{font-size:24px;}
  .track-header p{color:var(--muted); font-size:13px; margin-top:6px; line-height:1.5;}
  .track-header .hourline{font-size:11.5px; color:var(--gold); font-weight:700; margin-top:10px;}

  .module-label{font-size:12.5px; font-weight:700; color:var(--text); margin:20px 2px 10px; display:flex; align-items:center; gap:8px;}
  .module-label .badge{font-size:9.5px; color:var(--muted); font-weight:600; background:rgba(255,255,255,0.06); padding:2px 7px; border-radius:20px;}

  .lesson-row{display:flex; align-items:center; gap:14px; padding:15px; border-radius:14px;
    background:var(--ink-2); border:1px solid var(--line); margin-bottom:10px; cursor:pointer;}
  .lesson-num{width:34px;height:34px;border-radius:50%; flex:none; display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; border:1.5px solid var(--line); color:var(--muted);}
  .lesson-num.done{background:var(--gold); border-color:var(--gold); color:var(--ink);}
  .lesson-title{font-size:14.5px; font-weight:600;}
  .lesson-time{font-size:11px; color:var(--muted); margin-top:2px;}

  .lesson-eyebrow{font-size:11px; color:var(--gold); text-transform:uppercase; letter-spacing:0.1em; font-weight:700;}
  .lesson-content h2{font-size:22px; margin-top:8px; line-height:1.2;}
  .lesson-content .body{margin-top:16px; font-size:14.5px; line-height:1.7; color:#DDE1EC;}
  .lesson-content .body p{margin:0 0 14px;}
  .lesson-content .body strong{color:var(--gold);}
  .codeblock{background:#0D1830; border:1px solid var(--line); border-radius:12px; padding:14px;
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8FE3CF; margin:14px 0; overflow-x:auto; white-space:pre;}
  .callout{background:rgba(255,182,39,0.08); border:1px solid rgba(255,182,39,0.25); border-radius:12px; padding:13px 14px; font-size:13px; margin:16px 0; color:#F3E3B8;}
  .exercise{background:rgba(46,196,182,0.08); border:1.5px solid rgba(46,196,182,0.3); border-radius:12px; padding:15px; margin:18px 0; color:#DDF6F3;}
  .exercise .ex-label{font-size:11px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase; color:var(--teal); margin-bottom:8px; display:flex; align-items:center; gap:6px;}
  .exercise p{margin:0 0 8px; font-size:13.5px; line-height:1.6;}
  .exercise p:last-child{margin-bottom:0;}
  .btn{display:block; width:100%; text-align:center; padding:15px; border-radius:14px; border:none;
    font-family:'Inter',sans-serif; font-weight:700; font-size:14.5px; background:var(--gold); color:var(--ink); cursor:pointer; margin-top:18px;}
  .btn:active{transform:scale(0.98);}
  .btn.secondary{background:transparent; border:1.5px solid var(--line); color:var(--text);}

  .quiz-progress{font-size:12px; color:var(--muted); font-weight:600; margin-bottom:10px;}
  .quiz-q{font-family:'Fraunces',serif; font-size:19px; line-height:1.3; margin-bottom:18px;}
  .option{display:block; width:100%; text-align:left; padding:14px 15px; border-radius:13px; margin-bottom:10px;
    background:var(--ink-2); border:1.5px solid var(--line); color:var(--text); font-size:14px; font-family:'Inter',sans-serif; cursor:pointer;}
  .option.correct{border-color:var(--teal); background:rgba(46,196,182,0.12);}
  .option.wrong{border-color:var(--rose); background:rgba(242,99,123,0.12);}
  .option:disabled{opacity:0.75;}

  .result-stamp{text-align:center; padding:30px 10px 10px;}
  .stamp-circle{width:110px;height:110px;border-radius:50%; margin:0 auto 18px; border:3px solid var(--gold);
    display:flex; align-items:center; justify-content:center; flex-direction:column; transform:rotate(-6deg); font-family:'Fraunces',serif;}
  .stamp-circle .score{font-size:30px; font-weight:700; color:var(--gold);}
  .stamp-circle .of{font-size:11px; color:var(--muted);}

  .passport-head{padding:8px 2px 4px;}
  .passport-head h2{font-size:24px;}
  .passport-head p{color:var(--muted); font-size:13px; margin-top:6px;}
  .roadmap-bar{margin-top:16px; background:var(--ink-2); border:1px solid var(--line); border-radius:14px; padding:14px;}
  .roadmap-bar .row{display:flex; justify-content:space-between; font-size:12px; margin-bottom:6px;}
  .roadmap-bar .track-mini{height:6px; border-radius:4px; background:rgba(255,255,255,0.07); overflow:hidden; margin-bottom:12px;}
  .roadmap-bar .track-mini > div{height:100%;}
  .stamp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px;}
  .stamp-tile{aspect-ratio:1; border-radius:14px; border:1.5px dashed var(--line); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:4px; font-size:9.5px; text-align:center; padding:6px; color:var(--muted);}
  .stamp-tile.earned{border-style:solid; border-color:var(--gold); background:rgba(255,182,39,0.08); color:var(--text);}
  .stamp-tile .emoji{font-size:19px;}

  nav.tabbar{position:sticky; bottom:0; left:0; right:0; display:flex; background:rgba(18,33,63,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); padding:10px 10px calc(10px + env(safe-area-inset-bottom));}
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; background:none; border:none; color:var(--muted);
    font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; cursor:pointer; padding:6px 0;}
  .tab.active{color:var(--gold);}
  .tab .icon{font-size:19px;}
</style>
</head>
<body>
<div id="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">S</div>
      <div><div class="brand-name">Seekho</div><div class="brand-sub">Learn it here. Free, forever.</div></div>
    </div>
  </header>
  <main id="app"></main>
  <nav class="tabbar">
    <button class="tab" data-tab="home"><span class="icon">⌂</span>Home</button>
    <button class="tab" data-tab="learn"><span class="icon">▤</span>Learn</button>
    <button class="tab" data-tab="progress"><span class="icon">✦</span>Passport</button>
  </nav>
</div>

<script>
/* =================================================================
   CONTENT — authored once, shown for free, no API keys, no cost.
   Every lesson below is real and openable any time, in any order.
================================================================= */
const TRACKS = {

  ai: {
    title:"AI Tools", icon:"✦", color:"#FFB627", bg:"rgba(255,182,39,0.14)",
    desc:"Chat AI, research AI, image & voice AI, coding assistants, automation, and advanced AI workflows.",
    modules:[
      { title:"AI Foundations", lessons:[
        { id:"ai1", title:"What AI actually is (no jargon)", time:"15 min", hours:0.25, body:`
          <p>Forget the sci-fi robots. Today's "AI" mostly means one thing: a computer program that has read an enormous amount of text, images, or sound, and learned patterns from it well enough to <strong>predict what comes next</strong>.</p>
          <p>When you type a question into ChatGPT or Claude, the program isn't "looking it up" — it's predicting, word by word, the most likely helpful reply based on everything it learned. This kind of AI is called a <strong>Large Language Model</strong>, or <strong>LLM</strong>.</p>
          <p>Think of the autocomplete on your phone keyboard, the one that guesses your next word while texting. An LLM is that same basic idea — scaled up from guessing one word to writing whole paragraphs, using patterns learned from a huge slice of the internet, books, and other text.</p>
          <p>That's it. No magic. Once you understand "it predicts patterns," a lot of its strange behavior starts to make sense — including <strong>hallucination</strong>, where an AI states something false with total confidence. It's not lying on purpose; it's predicting what a plausible-sounding answer looks like, and sometimes that prediction is simply wrong.</p>
          <div class="callout">💡 Rule of thumb: treat AI like a very well-read assistant who sometimes guesses. Always double-check facts that matter — dates, numbers, medicine, law.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Open ChatGPT or Claude. Ask it a question you already know the answer to (your city's population, a well-known historical date, a fact about your field). Check if it's correct.</p>
          <p>Then ask something more obscure — a small, specific detail you're not sure it would know. See if you can catch it sounding confident but being wrong, or notice it correctly admitting uncertainty. This is the fastest way to build a real gut feeling for when to trust AI and when to double-check.</p></div>`,
          quiz:[
            {q:"What does an LLM (like ChatGPT or Claude) actually do?", options:["Searches the internet live for every answer","Predicts the most likely next words based on patterns it learned","Connects to a human who types the answer","Only works with pre-written scripts"], a:1},
            {q:"What is a 'hallucination' in AI?", options:["A visual glitch on screen","The AI stating something false with confident, plausible-sounding language","A type of virus","A slow response time"], a:1},
            {q:"Why should you double-check facts an AI gives you?", options:["AI never makes mistakes","AI can sound confident even when it's wrong","AI only answers in numbers","You should never trust AI at all"], a:1},
          ]},
        { id:"ai2", title:"Chat assistants: ChatGPT & Claude", time:"20 min", hours:0.33, body:`
          <p><strong>ChatGPT</strong> (by OpenAI) and <strong>Claude</strong> (by Anthropic) are chat-based AI assistants. Both have free versions you can use with just an email sign-up — no payment needed.</p>
          <p>What they're genuinely useful for: explaining a topic simply, checking your grammar, planning a study schedule, debugging code, writing a resume, practicing interview questions, or translating something.</p>
          <p>They're built on the same underlying idea — an LLM predicting helpful text — but each has its own tuning and "personality." Neither is objectively better for everything; people often find one explains certain topics more clearly, or one writes in a tone they prefer. The only way to know which fits you is to try both on something real.</p>
          <p>The skill that matters most is <strong>how you ask</strong> — this is called "prompting." A weak prompt: <em>"explain stocks."</em> A strong prompt: <em>"Explain what a stock is to a complete beginner, using one simple real-life example, in under 100 words."</em></p>
          <div class="callout">💡 Good prompts give three things: what you want, who it's for, and how long/detailed the answer should be.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Open ChatGPT and Claude (or one after the other if you only have one open). Ask both the <strong>exact same question</strong> — something you're actually curious about right now. Compare: which explanation felt clearer? Did they agree on the facts? Keep whichever answer was more useful to you.</p></div>`,
          quiz:[
            {q:"What is 'prompting'?", options:["Paying for AI access","How you phrase your question to get a better answer","A type of coding language","A subscription plan"], a:1},
            {q:"Which is a stronger prompt?", options:["\"explain stocks\"","\"Explain what a stock is to a beginner, with one example, in under 100 words\"","\"stocks??\"","\"tell me everything\""], a:1},
            {q:"Do you need to pay to use ChatGPT or Claude?", options:["Yes, always","No — both offer free versions to start","Only on weekends","Only if you're a student"], a:1},
          ]},
        { id:"ai3", title:"NotebookLM, Nanobanana & ElevenLabs", time:"25 min", hours:0.42, body:`
          <p><strong>NotebookLM</strong> (by Google, free) turns your own notes, PDFs, or articles into summaries, study guides, quiz questions, and even a spoken "podcast" conversation explaining them in two AI voices. Its key trick: it only answers from the material you gave it, so it won't wander off and make things up from the wider internet — genuinely useful for exam prep from your own class notes.</p>
          <p><strong>Nanobanana</strong> is the nickname people use for Google's fast AI image-generation model. Describe a picture in words, and it creates one — useful for posters, presentation visuals, or design mockups without design skills. It can also edit an existing photo based on instructions, like "remove the background" or "make this look like a watercolor painting."</p>
          <p><strong>ElevenLabs</strong> turns typed text into realistic spoken audio, and can also transcribe speech to text. People use it for voice-overs on videos, turning written lessons into audio to listen to while commuting, or even narrating an audiobook draft.</p>
          <div class="callout">💡 All three have free tiers with limits. Use free credits deliberately — plan what you'll generate before you start, rather than experimenting randomly.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Pick ONE of the three. If you have any notes or a PDF, upload it to NotebookLM and ask it a specific question about that content. Or open Nanobanana (or ChatGPT's built-in image tool) and generate one image from a clearly written description. Notice how much the result depends on how specific your instructions were.</p></div>`,
          quiz:[
            {q:"What makes NotebookLM different from a normal chatbot?", options:["It only answers using the documents you give it","It only works offline","It requires a paid API key","It only generates images"], a:0},
            {q:"Nanobanana is mainly used for:", options:["Text-to-speech voice-overs","Generating images from text descriptions","Writing code","Stock trading"], a:1},
            {q:"ElevenLabs is best known for:", options:["Image generation","Spreadsheet formulas","Realistic AI voice/audio from text","Video editing"], a:2},
          ]},
      ]},
      { title:"Search & Research AI", lessons:[
        { id:"ai4", title:"Perplexity & Gemini — AI that searches for you", time:"20 min", hours:0.33, body:`
          <p>Regular chat AI answers from what it learned during training, which has a cutoff date — ask it about something from last week and it may simply not know, or worse, guess. <strong>Perplexity</strong> and Google's <strong>Gemini</strong> are built to actively search the live web and cite sources while answering — closer to a research assistant than a chatbot.</p>
          <p>Use these when you need <strong>current information</strong>: today's news, this week's prices, a recent event, or anything time-sensitive. Always glance at the cited sources before trusting a specific number or claim — a good research AI shows its work, and that's exactly what makes it trustworthy or not.</p>
          <div class="callout">💡 Use chat AI (ChatGPT/Claude) for explaining and reasoning. Use search AI (Perplexity/Gemini) for "what's happening right now."</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Ask Perplexity or Gemini a question about something happening this week — news, a price, a local event. Open one of the sources it cites and confirm it's a real, relevant page, not just a plausible-looking link.</p></div>`,
          quiz:[
            {q:"Why would you use Perplexity instead of a regular chatbot?", options:["It's always free forever","It actively searches the live web and cites sources","It only works for coding","It never makes mistakes"], a:1},
            {q:"When is search-style AI most useful?", options:["For timeless facts like historical dates","For current/time-sensitive information","For writing poetry only","It's never useful"], a:1},
          ]},
      ]},
      { title:"Creating with AI", lessons:[
        { id:"ai5", title:"Image AI compared: Nanobanana, Midjourney, DALL-E", time:"20 min", hours:0.33, body:`
          <p><strong>Nanobanana (Google)</strong> — fast, great at following detailed instructions precisely, good for editing existing images too. Free tier available.</p>
          <p><strong>DALL-E (OpenAI, inside ChatGPT)</strong> — easy to use if you already use ChatGPT, solid general-purpose quality.</p>
          <p><strong>Midjourney</strong> — known for the most artistic, polished-looking results, but historically has no meaningful free tier — it's paid-only, so it's the one to skip if you're budget-conscious.</p>
          <p>A simple formula for a strong prompt: <strong>subject + style + mood/lighting + specific details</strong>. "A watercolor painting of a busy Mumbai street at golden-hour sunset, warm colors, gentle brush strokes" will beat "nice picture" every time.</p>
          <div class="callout">💡 Never use AI image tools to generate images of real people without their consent, or to create misleading "fake photos."</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Generate one image using Nanobanana or ChatGPT's image tool with a full descriptive prompt (subject + style + mood). Then generate a second one from just a single vague word. Compare the two — notice exactly what the extra detail bought you.</p></div>`,
          quiz:[
            {q:"Which of these is generally paid-only with no meaningful free tier?", options:["Nanobanana","DALL-E inside ChatGPT","Midjourney","None of them"], a:2},
            {q:"What makes an image prompt effective?", options:["Being vague so the AI can be creative","Describing subject, style, and mood clearly","Using only one word","Never describing color"], a:1},
          ]},
      ]},
      { title:"AI for Coders", lessons:[
        { id:"ai6", title:"GitHub Copilot, Cursor & Claude Code", time:"20 min", hours:0.33, body:`
          <p><strong>GitHub Copilot</strong> autocompletes as you type. <strong>Cursor</strong> is a full code editor built around AI, letting you describe a feature in plain English and get real code changes. <strong>Claude Code</strong> works from your command line, able to read your whole project and make multi-file changes, run commands, and fix errors on its own.</p>
          <p>There's a real difference between asking an AI to <strong>write</strong> code for you versus asking it to <strong>explain</strong> code that already exists. For a true beginner, lean on the "explain" mode much more at first — you learn far faster by understanding what's happening line by line than by only copy-pasting output you don't fully follow.</p>
          <div class="callout">💡 A good habit while learning: ask the AI to add comments explaining each line, and don't move on until you could explain it back in your own words.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Paste a short snippet of code — or the Python example from the Coding track's first lesson — into ChatGPT or Claude and ask it to explain what every single line does. Try to predict the explanation before reading it.</p></div>`,
          quiz:[
            {q:"What's the risk of relying fully on AI coding tools as a total beginner?", options:["There is no risk","You may not actually learn how the code works", "AI coding tools cost money always","They only work with Java"], a:1},
            {q:"Which of these can read an entire project and make multi-file changes from the command line?", options:["GitHub Copilot only","Claude Code","Neither can do this","Only Cursor"], a:1},
          ]},
      ]},
      { title:"Automation & Agents", lessons:[
        { id:"ai7", title:"Zapier, n8n & the idea of 'AI agents'", time:"20 min", hours:0.33, body:`
          <p><strong>Automation tools</strong> like Zapier and n8n connect apps together so tasks happen without you doing them manually. A classic example: "when someone fills out my Google Form, automatically add their info to a spreadsheet and send them a welcome email" — all without you touching anything after setup. Zapier is easier for beginners; n8n is free and open-source but needs a bit more setup.</p>
          <p>An <strong>AI agent</strong> takes this further: instead of a fixed set of steps, you give an AI a goal — like "research three suppliers for X and email me a comparison" — and it decides which actions to take, in what order, sometimes using tools on its own to get there.</p>
          <div class="callout">💡 Agents are powerful but new and imperfect — always review what an agent did before trusting the output for anything important.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Without building anything yet, write down (on paper or in a notes app) one repetitive task in your life you'd want automated: what should trigger it, and what should happen automatically afterward. This is exactly the thinking Zapier/n8n setup requires.</p></div>`,
          quiz:[
            {q:"What does an automation tool like Zapier do?", options:["Writes essays for you","Connects apps so tasks happen automatically without manual work","Only works for stock trading","Replaces your email entirely"], a:1},
            {q:"What makes an 'AI agent' different from a simple automation?", options:["Nothing, they're identical","An agent can decide its own steps toward a goal, not just follow a fixed sequence","Agents only work offline","Agents cannot use any tools"], a:1},
          ]},
      ]},
      { title:"AI Safety & Literacy", lessons:[
        { id:"ai8", title:"Spotting AI fakes & using AI responsibly", time:"20 min", hours:0.33, body:`
          <p>As AI image, voice, and video tools improve, "deepfakes" — realistic fake media of real people — are becoming easier to create and harder to spot. Warning signs: unnatural blinking or hands in images/video, voices that sound slightly flat or robotic under stress, and claims that seem designed to provoke strong emotion quickly.</p>
          <p>Before trusting or sharing something surprising: check if reputable news outlets are also reporting it, and consider that AI-generated content is now cheap and easy to produce at scale.</p>
          <p>On the flip side, using AI responsibly means: not passing off AI-written work as fully your own without disclosure where it matters (school, job applications), not generating fake images of real people, and being transparent when content is AI-assisted.</p>
          <div class="callout">💡 A simple personal rule: if an AI's output could hurt someone's reputation, finances, or safety if wrong, verify it independently before acting or sharing.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Find (or generate) a piece of AI-made content — an image is easiest. List 2-3 specific visual details that give it away as AI-generated, rather than just saying "it looks off."</p></div>`,
          quiz:[
            {q:"What is a 'deepfake'?", options:["A type of programming bug","Realistic AI-generated fake media of a real person","A slow internet connection","A kind of stock chart"], a:1},
            {q:"Before trusting a surprising AI-related claim, what's a good habit?", options:["Share it immediately","Check if reputable sources are also reporting it","Assume it must be true","Ignore all AI content forever"], a:1},
          ]},
      ]},
      { title:"Advanced AI Workflows & No-Code AI Apps", lessons:[
        { id:"aw1", title:"Chaining prompts for complex tasks", time:"20 min", hours:0.33, body:`
          <p>Complex tasks often need more than one prompt. <strong>Chaining</strong> means feeding one AI response into the next prompt as input, breaking a big job into steps: research → outline → draft → refine.</p>
          <p>Example: "Generate a market analysis for a tea stall business" → feed that into "Now write a marketing strategy based on this analysis" → feed both into "Now summarize this into a one-page executive summary." Each step gets a focused, simpler job than trying to do everything in one giant prompt.</p>
          <div class="callout">💡 If an answer feels shallow, it's often not that the AI "can't" do better — it's that the task needed to be broken into more steps.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Pick a real task you have — even something small, like planning a get-together. Write a 3-step prompt chain: a research prompt, then a plan prompt, then a summary prompt. Run all three in order in ChatGPT or Claude.</p></div>`,
          quiz:[
            {q:"What does 'chaining prompts' mean?", options:["Asking the same question repeatedly","Feeding one AI response into the next prompt as input, step by step","Using two AI tools at the same time for no reason","A way to make AI faster"], a:1},
            {q:"Why break a big task into a prompt chain?", options:["It's required by law","Each step gets a focused, simpler job, usually improving results","It uses less electricity","It's not actually useful"], a:1},
          ]},
        { id:"aw2", title:"Build a simple AI app with no code", time:"25 min", hours:0.42, body:`
          <p>No-code builders like <strong>Bubble</strong> and <strong>Glide</strong> let you build real, working apps — forms, buttons, databases — by dragging and arranging elements instead of writing code.</p>
          <p>Many of these tools let you connect an AI service through built-in "plugins" or "integrations," so your app can, for example, automatically summarize whatever a user types into a form, or generate a personalized reply.</p>
          <p>Start small: build a single-page app with one form and one AI-powered action, then expand from there once it works. Trying to build everything at once is the most common reason beginners abandon a no-code project halfway.</p>
          <div class="callout">💡 Free tiers are generous for personal projects; costs usually only appear once you have real paying users at scale.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Visit Bubble.io or Glide's website (free to browse, no sign-up needed to look) and check their template gallery. Find one template closest to an app idea you have, and note down what features it already includes.</p></div>`,
          quiz:[
            {q:"What do no-code tools like Bubble and Glide let you do?", options:["Only write raw code faster","Build real working apps by dragging and arranging elements, no code required","Only build games","Nothing useful for beginners"], a:1},
            {q:"What's a smart way to start a no-code AI app?", options:["Build every feature at once","Start with one form and one AI-powered action, then expand","Skip testing entirely","Avoid AI integrations"], a:1},
          ]},
        { id:"aw3", title:"RAG — Retrieval-Augmented Generation, explained simply", time:"20 min", hours:0.33, body:`
          <p>LLMs only "know" what they learned during training — they don't automatically know your private documents or very recent events. <strong>RAG (Retrieval-Augmented Generation)</strong> fixes this: before answering, the system first retrieves relevant chunks of text from a knowledge base (like your uploaded documents), and feeds them into the AI's prompt as extra context.</p>
          <p>This is exactly what powers tools like NotebookLM — the AI isn't "remembering" your documents between sessions, it's being handed the relevant parts fresh, every single time you ask a question.</p>
          <div class="callout">💡 If an AI tool says it can "answer from your files," it's almost certainly using RAG under the hood.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Open NotebookLM, upload any document (even a short one), and ask it a question that's only answerable from that specific document — not something general knowledge could answer. Watch it quote back the relevant part.</p></div>`,
          quiz:[
            {q:"What problem does RAG solve?", options:["Making AI generate images","Letting AI answer accurately about private/specific documents it wasn't trained on","Making AI faster at math","Removing the need for prompts"], a:1},
            {q:"What does RAG do before the AI answers?", options:["Nothing extra","Retrieves relevant text chunks and adds them as context to the prompt","Deletes the user's question","Trains a whole new AI model"], a:1},
          ]},
        { id:"aw4", title:"Fine-tuning vs. prompting", time:"15 min", hours:0.25, body:`
          <p><strong>Prompting</strong> means giving better instructions and examples in your message — fast, free, no technical setup, and you can change it instantly. This is what most of this app has taught you.</p>
          <p><strong>Fine-tuning</strong> means retraining the AI's actual internal settings on a specific dataset, permanently changing its default behavior — it requires data preparation, cost, and technical skill.</p>
          <p>For everyday use, better prompting solves the vast majority of problems. Fine-tuning is mainly for specialized company or product-level use cases where the same behavior needs to happen automatically, at scale, without a custom prompt every time.</p>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Think of one task you do with AI regularly that doesn't quite work the way you want. Write down: could a better <strong>prompt</strong> fix it? For almost everyone, the honest answer is yes.</p></div>`,
          quiz:[
            {q:"Which is faster and free, requiring no technical setup?", options:["Fine-tuning","Prompting","Neither","Both equally"], a:1},
            {q:"When would fine-tuning make sense over prompting?", options:["For every single everyday task","For specialized company/product use cases needing permanent, deep customization","Never, it's pointless","Only for image generation"], a:1},
          ]},
        { id:"aw5", title:"AI for data analysis in spreadsheets", time:"20 min", hours:0.33, body:`
          <p>Tools like ChatGPT and Claude can read an uploaded spreadsheet or CSV file and write/run code behind the scenes to analyze it — no need to learn a data language first.</p>
          <p>Example prompt: <em>"Here is my expenses CSV. Show me my top 5 spending categories and describe the monthly trend."</em> The AI will process the file and explain the findings in plain language, often alongside a chart.</p>
          <div class="callout">💡 For decisions that matter (taxes, big purchases), spot-check a few of the AI's numbers manually against the raw data before trusting them fully.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>If you have any spreadsheet or CSV handy, upload it to ChatGPT or Claude and ask for a summary of trends. If you don't have one, ask the AI to first create a small sample expenses CSV, then analyze it for you.</p></div>`,
          quiz:[
            {q:"What can you do by uploading a CSV to a chat AI?", options:["Nothing, it only reads text","Ask it to analyze and summarize the data, often with charts","Automatically invest your money","Convert it to a video"], a:1},
            {q:"Why spot-check AI's data analysis for important decisions?", options:["It's unnecessary","AI can make mistakes, especially on numbers that matter","AI cannot read spreadsheets at all","It's illegal not to"], a:1},
          ]},
        { id:"aw6", title:"Choosing the right AI tool — a decision guide", time:"15 min", hours:0.25, body:`
          <p>A simple mental checklist: Need to explain, write, or reason through something? → <strong>Chat AI</strong> (ChatGPT/Claude). Need current, live information? → <strong>Search AI</strong> (Perplexity/Gemini). Need an image? → <strong>Nanobanana/DALL-E</strong>. Need voice/audio? → <strong>ElevenLabs</strong>. Need to study your own documents? → <strong>NotebookLM</strong>. Need coding help? → <strong>Copilot/Cursor/Claude Code</strong>. Need repetitive tasks automated? → <strong>Zapier/n8n/agents</strong>.</p>
          <div class="callout">💡 Most of these have free tiers — the fastest way to learn which tool fits a task is to just try the closest match and see.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Write down 3 tasks you did this week. For each, identify which AI tool category from this checklist would have been the best fit — and whether you actually used the right one.</p></div>`,
          quiz:[
            {q:"You need today's news summarized with sources. Which type of tool fits best?", options:["Image AI","Search AI (like Perplexity/Gemini)","Voice AI","Automation tool"], a:1},
            {q:"You want to ask questions about your own uploaded class notes only. Best fit?", options:["Midjourney","NotebookLM","Zapier","GitHub Copilot"], a:1},
          ]},
      ]},
    ]
  },

  code: {
    title:"Coding", icon:"⌘", color:"#2EC4B6", bg:"rgba(46,196,182,0.14)",
    desc:"A real path from zero to shipping your own runnable apps — Python, HTML/CSS/JS, Java, C++, Git and databases.",
    modules:[
      { title:"Foundations", lessons:[
        { id:"c1", title:"Which language should you learn first?", time:"15 min", hours:0.25, body:`
          <p>You mentioned Python, HTML, C++ and Java — here's what each is actually for:</p>
          <p><strong>Python</strong> — general purpose, reads almost like English, used for AI, automation, data analysis. Best <strong>first language</strong> for beginners.</p>
          <p><strong>HTML/CSS</strong> — structure and style webpages. Learn alongside a bit of JavaScript to build your first working website.</p>
          <p><strong>Java</strong> — used heavily in large company software and Android apps. More strict/verbose than Python, good second language.</p>
          <p><strong>C++</strong> — used where speed matters most: games, operating systems, hardware. Steeper learning curve — usually a third language, not a first.</p>
          <p>None of this is wasted effort, by the way — once you understand programming concepts (variables, loops, functions) in one language, picking up a second and third is far faster, because you're mostly learning new syntax for ideas you already know.</p>
          <div class="callout">💡 Suggested order: Python (deep) → HTML/CSS/JS (deep) → Java → C++ → Git/GitHub → Databases.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Write down, in your own words, one thing you'd actually want to build (an app, a website, a game, a tool for your own life). Circle which language from this lesson fits that idea best — this becomes your motivation anchor for the rest of this track.</p></div>`,
          quiz:[
            {q:"Which is generally the best first programming language for beginners?", options:["C++","Python","Java","HTML"], a:1},
            {q:"HTML is technically:", options:["A programming language for AI","A markup language that structures webpages","A database","A version of Python"], a:1},
            {q:"C++ is most often chosen when:", options:["You want the simplest possible syntax","Speed and hardware control matter most (games, systems)","You're building a basic website","You're a total beginner"], a:1},
          ]},
      ]},
      { title:"Python: Zero to App", lessons:[
        { id:"p1", title:"Installing Python & running your first file", time:"20 min", hours:0.33, body:`
          <p>To write real, runnable programs (not just an online playground), install Python on your own computer:</p>
          <p><strong>Windows:</strong> go to python.org/downloads, download the installer, and — important — tick "Add Python to PATH" during install.<br>
          <strong>Mac:</strong> check by opening Terminal and typing <code>python3 --version</code>. If missing, download from python.org.<br>
          <strong>Android:</strong> apps like Pydroid 3 let you write and run Python directly on a phone.</p>
          <div class="codeblock">print("Hello, world!")</div>
          <p>Save this as <code>hello.py</code>, then run <code>python hello.py</code> (or <code>python3 hello.py</code> on Mac/Linux) in a terminal opened in that folder.</p>
          <div class="callout">💡 "python.org" is the only official source — never download Python from a random third-party site.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Actually install Python right now (or open Pydroid 3 on your phone). Create <code>hello.py</code>, type the line above exactly, and run it. Then change the text inside the quotes to something of your own and run it again — that's your first edit-and-rerun cycle, the loop you'll repeat thousands of times as a programmer.</p></div>`,
          quiz:[
            {q:"What must you tick during Windows installation to run Python from any folder?", options:["'Add Python to PATH'","'Enable dark mode'","'Install for all games'","Nothing, it's automatic"], a:0},
            {q:"What command runs a file named hello.py?", options:["run hello.py","python hello.py","open hello.py","start hello.py"], a:1},
            {q:"What app lets you code Python directly on Android?", options:["Pydroid 3","Photoshop","Excel","Zoom"], a:0},
          ]},
        { id:"p2", title:"Variables & data types", time:"20 min", hours:0.33, body:`
          <p>A <strong>variable</strong> stores a value with a name you choose:</p>
          <div class="codeblock">age = 22
name = "Priya"
height = 5.4
is_student = True</div>
          <p>Python has core data types: <strong>int</strong> (whole numbers), <strong>float</strong> (decimals), <strong>str</strong> (text, in quotes), and <strong>bool</strong> (True/False).</p>
          <div class="codeblock">print(f"{name} is {age} years old.")</div>
          <p>Try changing the values and re-running the file — this is the fastest way to build intuition. Notice that mixing types incorrectly (like adding a number to a piece of text directly) causes an error — Python cares about type, even though you don't have to declare it upfront like some other languages.</p>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>In a new file, create four variables about yourself: your name (str), your age (int), your height in some unit (float), and whether you're currently a student (bool). Print a full sentence using an f-string combining all four.</p></div>`,
          quiz:[
            {q:"Which data type is 5.4?", options:["int","float","str","bool"], a:1},
            {q:"What does 'True' represent in Python?", options:["A string","A boolean value","A float","An error"], a:1},
            {q:"What does an f-string let you do?", options:["Delete variables","Insert variable values directly inside text", "Only print numbers","Run loops faster"], a:1},
          ]},
        { id:"p3", title:"Control flow: if / else", time:"20 min", hours:0.33, body:`
          <div class="codeblock">balance = 500

if balance &gt; 1000:
    print("You can invest some of this.")
elif balance &gt; 0:
    print("Keep saving before you invest.")
else:
    print("Balance is empty.")</div>
          <p>Python checks conditions top to bottom and runs the first block that's true. Notice the <strong>indentation</strong> (4 spaces) — Python uses spacing, not curly braces, to know what's inside each block. Get the indentation wrong and the code will error or behave unexpectedly — this trips up almost every beginner at least once, so don't worry if it happens to you.</p>
          <div class="callout">💡 Comparison operators: == (equal to), != (not equal), &gt;, &lt;, &gt;=, &lt;=.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Change the <code>balance</code> value to three different numbers (negative, small positive, and large) and run the file each time, confirming the right message prints for each case. Then add a fourth condition of your own — like a special message if balance is exactly 0.</p></div>`,
          quiz:[
            {q:"What does Python use to define what's inside an if-block?", options:["Curly braces {}","Indentation (spacing)","Semicolons","Nothing needed"], a:1},
            {q:"What does == mean in Python?", options:["Assign a value","Check if two things are equal","Add two numbers","Not equal"], a:1},
            {q:"If the first 'if' condition is False, what happens next?", options:["The program stops","Python checks the next elif or else", "Nothing runs at all","It repeats the if forever"], a:1},
          ]},
        { id:"p4", title:"Loops: doing things again and again", time:"20 min", hours:0.33, body:`
          <div class="codeblock">for i in range(1, 4):
    print("Lesson", i, "complete!")

fruits = ["mango", "banana", "apple"]
for fruit in fruits:
    print(fruit)</div>
          <p>A <strong>while loop</strong> repeats as long as a condition stays true — useful when you don't know exactly how many times you'll repeat:</p>
          <div class="codeblock">savings = 0
while savings &lt; 1000:
    savings += 200
    print("Savings now:", savings)</div>
          <div class="callout">💡 Careful with while loops — if the condition never becomes false, your program runs forever. This is called an "infinite loop."</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Write a for loop that prints the numbers 1 to 10, but only prints the even ones (hint: use <code>if number % 2 == 0</code> inside the loop). Then write a while loop that counts down from 5 to 1 before printing "Liftoff!".</p></div>`,
          quiz:[
            {q:"What does range(1, 4) produce in a for loop?", options:["1, 2, 3","1, 2, 3, 4","0, 1, 2, 3","Only 4"], a:0},
            {q:"When is a while loop especially useful?", options:["When you know the exact repeat count in advance","When you don't know exactly how many repeats you'll need","Never, always use for","Only for printing text"], a:1},
            {q:"What's an 'infinite loop'?", options:["A loop that runs exactly once","A loop whose condition never becomes false, so it never stops","A type of variable","A syntax error"], a:1},
          ]},
        { id:"p5", title:"Functions: reusable blocks of code", time:"20 min", hours:0.33, body:`
          <div class="codeblock">def greet(name):
    return f"Hello, {name}! Welcome."

message = greet("Arjun")
print(message)

def add(a, b):
    return a + b

print(add(4, 7))   # 11</div>
          <p><code>def</code> defines a function. The values inside the parentheses (<code>name</code>, or <code>a, b</code>) are <strong>parameters</strong> — inputs the function needs. <code>return</code> sends a value back out to wherever the function was called.</p>
          <p>Functions are the building block of every real program — they let you break a big problem into small, testable pieces, and reuse them anywhere without retyping the same logic.</p>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Write a function called <code>discount_price</code> that takes a price and a discount percentage, and returns the final price after the discount. Test it by calling it with a few different values and printing the results.</p></div>`,
          quiz:[
            {q:"What keyword defines a function in Python?", options:["func","def","function","new"], a:1},
            {q:"What does 'return' do inside a function?", options:["Prints text permanently","Sends a value back to where the function was called","Deletes the function","Stops the whole program"], a:1},
            {q:"Why are functions useful?", options:["They make code slower","They let you reuse code without rewriting it","They only work with numbers","They replace variables entirely"], a:1},
          ]},
        { id:"p6", title:"Lists & dictionaries", time:"20 min", hours:0.33, body:`
          <div class="codeblock">expenses = [200, 450, 100, 900]
expenses.append(50)
print(expenses[0])        # 200 (first item)
print(sum(expenses))      # total</div>
          <div class="codeblock">student = {"name": "Meera", "age": 21, "city": "Pune"}
print(student["name"])    # Meera
student["age"] = 22       # update a value</div>
          <p>Lists are ordered and accessed by position (index, starting at 0). Dictionaries are accessed by a named key instead of a position — much clearer for real-world data where each value has a label.</p>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Create a list of 5 of your own expenses (just numbers). Print the total and the average (total divided by the count). Then create a dictionary representing yourself with at least 3 keys, and print one value by its key.</p></div>`,
          quiz:[
            {q:"What index does the first item in a Python list have?", options:["1","0","-1","It has no index"], a:1},
            {q:"How do you access a dictionary value by its key?", options:["dict[0]","dict['key']","dict.first()","dict->key"], a:1},
            {q:"What does .append() do to a list?", options:["Removes the last item","Adds an item to the end","Sorts the list","Deletes the whole list"], a:1},
          ]},
        { id:"p7", title:"Files & handling errors", time:"20 min", hours:0.33, body:`
          <div class="codeblock">with open("notes.txt", "w") as f:
    f.write("My first saved file!")

with open("notes.txt", "r") as f:
    print(f.read())</div>
          <p><code>"w"</code> mode writes (overwrites) a file, <code>"r"</code> reads it. The <code>with</code> keyword automatically closes the file safely when done.</p>
          <p>To handle errors without crashing the whole program, use <strong>try/except</strong>:</p>
          <div class="codeblock">try:
    number = int(input("Enter a number: "))
    print(100 / number)
except ValueError:
    print("That wasn't a valid number.")
except ZeroDivisionError:
    print("Can't divide by zero.")</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 5 min</div>
          <p>Write a small program that asks the user for their name and saves it to a file called <code>myname.txt</code>. Then write a separate bit of code that reads the file back and greets that name. Wrap the reading part in try/except in case the file doesn't exist yet.</p></div>`,
          quiz:[
            {q:"What does 'w' mode do when opening a file?", options:["Reads a file","Writes (overwrites) a file","Deletes a file","Renames a file"], a:1},
            {q:"What does try/except let you do?", options:["Speed up your code","Handle errors without crashing the program","Write files faster","Avoid using variables"], a:1},
            {q:"Why use 'with open(...) as f'?", options:["It's required syntax with no benefit","It automatically closes the file safely when done","It makes the file smaller","It encrypts the file"], a:1},
          ]},
        { id:"p8", title:"Final project: build a Budget Tracker app", time:"45 min", hours:0.75, body:`
          <p>Time to combine everything — variables, loops, functions, lists, and files — into one real, runnable command-line app: a personal budget tracker.</p>
          <div class="codeblock">expenses = []

def add_expense():
    desc = input("What did you spend on? ")
    amount = float(input("How much? "))
    expenses.append({"desc": desc, "amount": amount})
    print(f"Added: {desc} - {amount}")

def show_total():
    total = sum(e["amount"] for e in expenses)
    print(f"Total spent: {total}")

def save_to_file():
    with open("budget.txt", "w") as f:
        for e in expenses:
            f.write(f"{e['desc']}: {e['amount']}\\n")
    print("Saved to budget.txt")

while True:
    choice = input("\\n1) Add expense  2) Show total  3) Save & exit\\n> ")
    if choice == "1":
        add_expense()
    elif choice == "2":
        show_total()
    elif choice == "3":
        save_to_file()
        break
    else:
        print("Please choose 1, 2 or 3.")</div>
          <p>Save this as <code>budget.py</code> and run <code>python budget.py</code>. Add a few expenses, check your total, and save — you now own a working app you built yourself, and every single line is something you learned in this module.</p>
          <div class="callout">💡 Try extending it yourself: add a "delete expense" option, or a monthly spending limit warning. That's exactly how real developers grow a project.</div>
          <div class="exercise"><div class="ex-label">🎯 Try it yourself · 15 min</div>
          <p>Type this entire program yourself (don't just copy-paste — typing it builds muscle memory), run it, and actually use it to log a real day of your spending. Then pick ONE extension and implement it: a delete option, a running spending limit warning, or a "show expenses by category" option using a second field.</p></div>`,
          quiz:[
            {q:"What does the while True loop do in this app?", options:["Runs once and stops","Keeps showing the menu until the user chooses to exit","Deletes all expenses","Only works for saving files"], a:1},
            {q:"What does sum(e[\"amount\"] for e in expenses) calculate?", options:["The number of expenses","The total of all expense amounts","The average expense","The first expense only"], a:1},
            {q:"What's a good next step to extend this project?", options:["Add a delete-expense option or spending limit warning","Nothing, it's already finished forever","Rewrite it in a different language immediately","Delete all the functions"], a:0},
          ]},
      ]},
      { title:"Web Basics: HTML, CSS & JS", lessons:[
        { id:"h1", title:"HTML basics — structure a webpage", time:"20 min", hours:0.33, body:`
          <p>Every webpage is built from HTML "tags" that wrap around content:</p>
          <div class="codeblock">&lt;html&gt;
  &lt;body&gt;
    &lt;h1&gt;My First Page&lt;/h1&gt;
